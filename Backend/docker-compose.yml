version: '3.8'

services:
  ekaant-app:
    build: ./
    ports:
      - "3009:3009"
    volumes:
      - ./:/usr/src/app  # Mounts your whole project folder into the container.
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./:/etc/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    networks:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

networks:
  monitoring:
