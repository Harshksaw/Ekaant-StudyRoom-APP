version: "3.9"
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: ekaant  # Replace with your actual password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"  # Map port 5050 on your host to port 80 in the container
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org  # Replace with your email
      PGADMIN_DEFAULT_PASSWORD: admin  # Replace with a strong password!
volumes:
  postgres_data: