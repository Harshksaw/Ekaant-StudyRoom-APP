name: CI Checks for Backend

on:
  pull_request:
    branches:
      - main
      - dev  # Modify based on your workflow

jobs:
  nodejs-ci:
    name: Check Node.js Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install Dependencies
        run: cd Backend && npm install

      - name: Lint Code
        run: cd Backend && npm run lint  # Ensure you have a "lint" script

      - name: Run Tests
        run: cd Backend && npm test  # Ensure you have a test script

      - name: Build Project
        run: cd Backend && npm run build  # Ensure you have a build script

  docker-ci:
    name: Check Docker Build & Run
    runs-on: ubuntu-latest
    needs: nodejs-ci  # Run only if Node.js checks pass

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Docker
        run: |
          docker --version
          docker-compose --version

      - name: Build Docker Image
        run: cd Backend && docker-compose build

      - name: Run Docker Containers
        run: cd Backend && docker-compose up -d

      - name: Wait for Containers
        run: sleep 10  # Wait for DB and services to start

      - name: Check if Backend is Running
        run: curl -f http://localhost:3009/health || exit 1

      - name: Check Logs for Errors
        run: cd Backend && docker-compose logs

      - name: Stop Containers
        run: cd Backend && docker-compose down
